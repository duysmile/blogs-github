name: Rebuild duysmile.com

# duysmile.com reads blogs/ at build time, so a new or edited post needs a fresh Netlify build.
on:
  push:
    branches: [master]
    paths: ['blogs/**']
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # GitHub's API caches "latest commit on master" for up to 60s; the site resolves it at build time.
      - name: Wait for GitHub's API cache to catch up
        run: sleep 75
      - name: Trigger Netlify build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret NETLIFY_BUILD_HOOK is not set in this repo."
            exit 1
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$HOOK"
          echo "Netlify build triggered."
